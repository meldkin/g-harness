# CommandCode must expose an OpenAI Chat Completions-compatible endpoint.
# Set COMMANDCODE_BASE_URL and COMMANDCODE_API_KEY outside this file.
- id: llm-deepseek
  config:
    apiKeyEnv: COMMANDCODE_API_KEY
    protocol: chat-completions
    baseURL: !!js process.env.COMMANDCODE_BASE_URL
- insert:
    - id: solo-policy
      name: '@solo-code/dsh-solo-policy'
    - id: solo-guidance
      name: '@solo-code/dsh-solo-guidance'
