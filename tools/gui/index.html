<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEV Worker Console</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ee; --muted:#9aa3b2;
          --ok:#2ea043; --warn:#d29922; --bad:#f85149; --accent:#7c9cff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
         background:var(--bg); color:var(--fg); }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; }
  header .muted { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns: 360px 1fr; gap:14px; padding:14px 18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  label { display:block; color:var(--muted); font-size:12px; margin:10px 0 4px; }
  select, textarea, input { width:100%; background:#0c0e13; color:var(--fg); border:1px solid var(--line);
         border-radius:6px; padding:8px; font:inherit; }
  textarea { min-height:150px; resize:vertical; }
  button { background:var(--accent); color:#0b0d12; border:0; border-radius:6px; padding:9px 14px;
         font:inherit; font-weight:700; cursor:pointer; margin-top:10px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:12px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  pre { background:#0c0e13; border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto;
        max-height:40vh; white-space:pre-wrap; word-break:break-word; margin:0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kv { display:flex; justify-content:space-between; gap:8px; font-size:12px; }
  .muted { color:var(--muted); }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>JEV Worker Console</h1>
  <span class="muted">localhost-only · token bảo vệ · chỉ gọi wrapper trong allowlist</span>
</header>
<main>
  <section>
    <div class="panel">
      <h2>Worker phát hiện trên máy</h2>
      <div id="workers" class="muted">đang tải…</div>
      <div class="hint">CLI phải có trên PATH <em>và</em> wrapper phải tồn tại mới chạy được.</div>
    </div>
    <div class="panel" style="margin-top:14px">
      <h2>Catalog &amp; .env</h2>
      <div id="catalog" class="muted">đang tải…</div>
      <div class="hint">Chỉ hiện <b>tên</b> key trong <code>.env</code> — không bao giờ hiện giá trị.</div>
    </div>
  </section>

  <section class="panel">
    <h2>Chạy một task qua worker</h2>
    <div class="row">
      <div style="flex:1">
        <label for="worker">Worker</label>
        <select id="worker"></select>
      </div>
      <div style="flex:1">
        <label for="model">Model (từ catalog)</label>
        <select id="model"><option value="">(mặc định của wrapper)</option></select>
      </div>
    </div>
    <label for="brief">Brief (self-contained — worker không thấy lịch sử phiên này)</label>
    <textarea id="brief" placeholder="Mô tả task, đường dẫn file, ràng buộc, kết quả gate mong đợi…"></textarea>
    <div class="row" style="margin-top:8px">
      <label class="chip"><input type="checkbox" id="allow_tools" style="width:auto"> gemini: --allow-tools</label>
      <label class="chip"><input type="checkbox" id="free" style="width:auto"> opencode: --free</label>
      <div style="flex:1"></div>
      <label for="timeout" class="muted">timeout (s)</label>
      <input id="timeout" type="number" min="10" max="1800" value="300" style="width:90px">
    </div>
    <button id="run">Run</button>
    <div id="status" class="hint"></div>
    <div id="result" style="margin-top:12px"></div>
  </section>
</main>

<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "");

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-Token": TOKEN, ...(opts.headers || {}) } });
  return { ok: res.ok, status: res.status, body: await res.json().catch(() => ({})) };
}

let STATE = null;

function renderState(s) {
  STATE = s;
  const w = $("workers"); w.textContent = "";
  s.workers.forEach(x => {
    const line = document.createElement("div");
    line.className = "kv";
    const left = document.createElement("span");
    left.textContent = x.id + " · " + x.label;
    const right = document.createElement("span");
    right.className = x.ready ? "ok" : (x.cli_path ? "warn" : "bad");
    right.textContent = x.ready ? "ready" : (x.note || (x.cli_path ? "wrapper thiếu" : "CLI không có"));
    right.title = x.cli_path || ("không thấy " + x.cli + " trên PATH");
    line.append(left, right);
    w.append(line);
  });

  const provCounts = Object.entries(s.providers).map(([k, v]) => k + "=" + v.length).join(", ");
  const c = $("catalog"); c.textContent = "";
  [["providers", provCounts || "(không đọc được .opencode/opencode.json)"],
   ["models", (s.models?.length || 0) + " model"],
   [".env keys", (s.env_keys || []).join(", ")]].forEach(([k, v]) => {
    const d = document.createElement("div"); d.className = "kv";
    const a = document.createElement("span"); a.className = "muted"; a.textContent = k;
    const b = document.createElement("span"); b.textContent = v;
    d.append(a, b); c.append(d);
  });

  const sel = $("worker"); sel.textContent = "";
  s.workers.forEach(x => {
    const o = document.createElement("option");
    o.value = x.id;
    o.disabled = !x.ready;
    o.textContent = x.label + (x.ready ? "" : "  — " + (x.note || "chưa sẵn sàng"));
    sel.append(o);
  });

  const ms = $("model");
  const byProv = {};
  (s.models || []).forEach(m => { (byProv[m.provider] ||= []).push(m); });
  Object.keys(byProv).forEach(prov => {
    const g = document.createElement("optgroup"); g.label = prov;
    byProv[prov].forEach(m => {
      const o = document.createElement("option"); o.value = m.ref; o.textContent = m.key + "  (" + m.ref + ")";
      g.append(o);
    });
    ms.append(g);
  });
}

async function load() {
  const r = await api("/api/state");
  if (!r.ok) { $("workers").textContent = "lỗi " + r.status; return; }
  renderState(r.body);
}

async function run() {
  const worker = $("worker").value;
  const model = $("model").value || null;
  const brief = $("brief").value;
  const flags = { allow_tools: $("allow_tools").checked, free: $("free").checked };
  $("status").textContent = "đang chạy…";
  $("result").textContent = "";
  const t0 = Date.now();
  const r = await api("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ worker, model, brief, flags, timeout: Number($("timeout").value) || 300 })
  });
  $("status").textContent = r.ok ? ("xong sau " + ((Date.now() - t0) / 1000).toFixed(1) + "s")
                                 : ("lỗi: " + (r.body.error || r.status));
  if (!r.ok) return;
  const out = r.body;
  const box = $("result");
  const mk = (title, text, cls) => {
    const h = document.createElement("div"); h.className = "muted"; h.textContent = title; h.style.marginTop = "8px";
    const p = document.createElement("pre"); if (cls) p.className = cls; p.textContent = esc(text);
    box.append(h, p);
  };
  mk("argv", JSON.stringify(out.argv));
  mk("exit code", String(out.returncode));
  mk("stdout", out.stdout || "(rỗng)");
  mk("stderr", out.stderr || "(rỗng)", out.returncode === 0 ? "" : "bad");
}

$("run").addEventListener("click", run);
load();
</script>
</body>
</html>
